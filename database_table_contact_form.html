<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submissions Dashboard</title>
    <style>
        body { font-family: sans-serif; max-width: 1700px; margin: 30px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: top; font-size: 13px; }
        th { background-color: #f4f4f4; }
        .file-tag { display: inline-block; background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-top: 4px; }
    </style>
</head>
<body>

    <h2>Form Submissions Dashboard</h2>
    <table id="submissions-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Occupation</th>
                <th>Nationality</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Address & Location</th>
                <th>Message</th>
                <th>Saved Files</th>
                <th>Submitted At</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="10">Loading submissions...</td></tr>
        </tbody>
    </table>

    <script>
        const API_URL = "https://dynamic-form-handler.onrender.com/api/submissions";

        async function loadSubmissions() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                
                const submissions = result.data || [];
                
                const tbody = document.querySelector("#submissions-table tbody");
                tbody.innerHTML = ""; 

                if (submissions.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="10">No submissions found.</td></tr>';
                    return;
                }

                submissions.forEach(sub => {
                    const p = sub.payload || {};
                    
                    // Fields mapping
                    let fullName = p.name || `${p.first_name || ''} ${p.last_name || ''}`.trim() || 'Unknown';
                    let occupation = p.occupation || '-';
                    let nationality = p.nationality || '-';
                    let email = p.email ? `<a href="mailto:${p.email}">${p.email}</a>` : '-';
                    let phone = p.phone || '-';

                    // Address Info
                    let addressParts = [p.street_address, p.city, p.postal_code, p.country].filter(Boolean);
                    let addressHtml = addressParts.length > 0 ? addressParts.join(', ') : '-';

                    let message = p.message || '-';
                    let fileHtml = sub.saved_files ? `<div class="file-tag">📎 ${sub.saved_files}</div>` : '-';

                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${sub.id}</td>
                        <td><strong>${fullName}</strong></td>
                        <td>${occupation}</td>
                        <td>${nationality}</td>
                        <td>${email}</td>
                        <td>${phone}</td>
                        <td>${addressHtml}</td>
                        <td>${message}</td>
                        <td>${fileHtml}</td>
                        <td>${sub.submitted_at}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error("Failed to load submissions:", error);
                document.querySelector("#submissions-table tbody").innerHTML = 
                    '<tr><td colspan="10" style="color: red;">Failed to load data from backend API.</td></tr>';
            }
        }

        loadSubmissions();
    </script>

</body>
</html>
